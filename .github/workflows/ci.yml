name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      # The Linux release is a static musl build: checked here, so a change
      # that breaks it fails the push rather than the release.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl

  # NixOS installs the flake, not the tarball, so the flake is evaluated on
  # every change: a renamed input, a stale cargoLock or a nixpkgs platform
  # error would otherwise reach the first user who runs install.sh.
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check --no-build --all-systems
      - run: nix build .#default --no-link

  # One release per version: a push to main whose Cargo.toml version has no
  # release yet builds the four targets and publishes `v<version>`, marked
  # latest, which is where install.sh downloads from. A push that keeps the
  # version publishes nothing, so a release never changes once it exists.
  version:
    # The interactive journeys gate it too: a regression in the screen or the
    # confinement must not reach the binaries install.sh serves.
    needs: [test, flake, interactive]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to publish"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Static musl: a glibc build from these runners needs the runner's
          # own glibc (2.39), which most servers do not have.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled: GitHub retired the Intel macOS runner.
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # ring compiles C, and a musl target needs musl's compiler for it.
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: strip target/${{ matrix.target }}/release/axe
      - name: Package
        run: |
          tar=axe-${{ matrix.target }}.tar.gz
          cp target/${{ matrix.target }}/release/axe axe
          tar -czf "$tar" axe
          if command -v sha256sum >/dev/null; then
            sha256sum "$tar" > "$tar.sha256"
          else
            shasum -a 256 "$tar" > "$tar.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: axe-${{ matrix.target }}
          path: axe-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  # One job creates the release with every binary in it, so a failed target
  # leaves no release at all rather than one missing a platform.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two pushes of the same new version: the second waits, sees the release
    # the first made, and publishes nothing.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG was published by an earlier run"
            exit 0
          fi
          [ "$(ls dist/*.tar.gz | wc -l)" -eq 4 ] || { ls dist; echo "expected four targets" >&2; exit 1; }
          # What changed since the previous version: its commit subjects.
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            { echo "Changes since $prev:"; echo; git log --no-merges --format='- %s' "$prev..$GITHUB_SHA"; } > notes.md
          else
            echo "The first versioned release." > notes.md
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "axe ${TAG#v}" \
            --notes-file notes.md --latest

  interactive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y tmux python3-pyte
      - run: ./harness.py --expect "mock/mock-1" --expect "ok" "text:ok"

      # The screen and the kernel are what unit tests cannot see, so the
      # journeys AGENTS.md documents are the gate. Explore mode's confinement
      # first: an allowlisted command runs, a write outside its directories and
      # an exec outside the allowlist do not.
      - name: explore mode's confinement
        run: |
          set -ex
          ./harness.py --scroll 400 'tool:bash:{"command":"head -n 1 tmux.conf"}' '!Escape' 'show:' \
            --expect 'set-option -g status off'
          ./harness.py --scroll 400 'tool:bash:{"command":"echo x > /tmp/axe-ci"}' '!Escape' 'show:' \
            --expect 'no write outside a scratch'
          ./harness.py --scroll 400 'tool:bash:{"command":"tmux -V"}' '!Escape' 'show:' \
            --expect 'Permission denied'

      - name: the mid-turn queue takes a line back
        run: |
          ./harness.py --wait 1 --scroll 20 \
            'tool:bash:{"command":"python3 -c \"import time;time.sleep(6)\""}' hello '!Up' '!Escape' '!Escape' \
            --expect '│ hello'

      - name: a resize, fetch paging, the host guard and /compact
        run: |
          set -ex
          ./harness.py --wait 1 --scroll 60 'text:hello' '@resize:60x20' 'text:again' --expect 'again'
          # Narrowing rewraps the frame's long rows; the next block still sits
          # one blank row under the last one, not under the rewrapped rows.
          ./harness.py --size 60x30 --wait 1 --scroll 60 'text:aaa' '@resize:40x30' 'text:bbb' \
            --expect $' aaa\n\n █ text:bbb'
          # A terminal that truncates instead leaves the measurement nothing to
          # confirm: no row is claimed, so the reply above the frame survives.
          ./harness.py --term pyte --size 60x30 --wait 1 --scroll 60 'text:aaa' '@resize:40x30' 'text:bbb' \
            --expect $' █ text:aaa\n\n aaa\n' --expect $' bbb\n'
          # A terminal too short for the whole frame keeps a row above it, so
          # writing a block never scrolls the frame itself into scrollback.
          ./harness.py --size 30x7 --wait 1 --scroll 40 'text:aaa' 'text:bbb' --refute 'Responding'
          ./harness.py --wait 1 --scroll 100 'fetch:plain@2+20' '!Escape' 'show:' --expect 'use start 22'
          ./harness.py --no-fetch-local --wait 1 --scroll 60 'fetch:plain' '!Escape' 'show:' \
            --expect 'refused host'
          ./harness.py --wait 1 --scroll 40 'text:one' '/compact' --expect 'Mock summary of the session.'
          # A finished turn pings through tmux's passthrough; an interrupted
          # one and a config without `notify` send nothing.
          ./harness.py --notify osc777 --wait 1 'text:hi' \
            --expect-raw '\x1bPtmux;\x1b\x1b]777;notify;axe;text:hi: done\x07\x1b\\'
          ./harness.py --notify osc9 --wait 1 'tool:bash:{"command":"sleep 5"}' '!Escape' '!Escape' \
            --refute-raw ']9;'
          ./harness.py --wait 1 'text:hi' --refute-raw '\x07'
          # Every command and a `!cmd` while the screen is up: a debug build
          # asserts nothing else writes the terminal then, and the panic ends
          # the run, which fails the journey.
          ./harness.py --wait 1 --scroll 80 '/model' '!Escape' '/sessions' '!Escape' '/skills' '/mcp' \
            '/help' ' !echo hi' '/thinking' '!Escape' '/new' --refute 'panicked'

      # A project MCP file is code a repository shipped: one approval, then no
      # question at the next start.
      - name: a project MCP file asks once
        run: |
          set -ex
          w="$RUNNER_TEMP/axe-mcp"
          rm -rf "$w"
          mkdir -p "$w/.git"
          cat > "$w/srv.sh" <<'SRV'
          read line
          echo '{"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2025-06-18","capabilities":{},"serverInfo":{"name":"t","version":"1"}}}'
          read line
          read line
          echo '{"jsonrpc":"2.0","id":2,"result":{"tools":[{"name":"echo","description":"say it back","inputSchema":{"type":"object"}}]}}'
          while read line; do
            id=$(printf '%s' "$line" | sed -n 's/.*"id":\([0-9]*\).*/\1/p')
            echo "{\"jsonrpc\":\"2.0\",\"id\":$id,\"result\":{\"content\":[{\"type\":\"text\",\"text\":\"said it back\"}]}}"
          done
          SRV
          printf '{"mcpServers":{"t":{"command":"/bin/sh","args":["%s/srv.sh"]}}}\n' "$w" > "$w/.mcp.json"
          ./harness.py --work "$w" --timeout 12 --scroll 120 'y' '/mcp' --expect 'mcp t: 1 tool'
          ./harness.py --work "$w" --timeout 12 --scroll 120 '/mcp' --refute 'run them?'

      # The config's blocked paths: `read` asks and the answer is on a red
      # line, `bash` meets the kernel even in a session that allowed the
      # read before, and the user's own `!cmd` is not confined at all.
      - name: a blocked path asks, and bash cannot reach it
        run: |
          set -ex
          w="$RUNNER_TEMP/axe-blocked"
          rm -rf "$w"
          mkdir -p "$w/secret"
          echo TOPSECRET > "$w/secret/key"
          h="./harness.py --work $w --blocked secret --wait 1"
          $h --scroll 40 'tool:read:{"path":"secret/key"}' --expect 'Allow for this session? [y/N]'
          $h --scroll 60 'tool:read:{"path":"secret/key"}' 'n' '!Escape' '!Escape' \
            --expect 'blocked path, not allowed'
          # After a yes the loop reads on unasked, faster than tmux keeps rows,
          # so the answer is checked by what it let through.
          $h --scroll 400 'tool:read:{"path":"secret/key"}' 'y' '!Escape' '!Escape' 'show:' \
            --expect 'TOPSECRET' --refute 'not allowed'
          $h --scroll 400 'tool:bash:{"command":"cat secret/key"}' '!Escape' 'show:' \
            --expect 'Permission denied' --refute 'TOPSECRET'
          $h --scroll 40 ' !cat secret/key' --expect 'TOPSECRET'

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-targets --lcov --output-path lcov.info --fail-under-lines 55
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
