[package]
name = "nano"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"

# Sessions archive old bodies with gzip. `rust_backend` is miniz_oxide, so no
# system zlib and no C build step.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Landlock and seccomp are syscalls, and std exposes neither. Already in the
# lock file through rustls, so this adds no download; Linux-only, because the
# macOS side needs nothing below std.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
