[package]
name = "axe"
version = "0.11.7"
edition = "2021"

[dependencies]
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# Already in the tree through ratatui, so the direct dependency downloads and
# builds nothing new. Width needs East Asian Width and emoji tables, which std
# does not carry.
unicode-width = "0.2"

# Landlock and seccomp are syscalls, and std exposes neither. Already in the
# lock file through rustls, so this adds no download; Linux-only, because the
# macOS side needs nothing below std.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
